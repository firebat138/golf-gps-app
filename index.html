<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Golf GPS">
    
    <title>Golf GPS</title>
    
    <!-- Mapbox GL JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    
    <!-- App Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Setup Screen -->
    <div id="setup-screen" class="setup-screen">
        <div class="setup-container">
            <div class="setup-header">
                <h1>Golf GPS</h1>
                <p>Scoring for up to 4 golfers</p>
            </div>

            <div class="setup-form">
                <div class="player-input-group">
                    <label>Player 1</label>
                    <input type="text" id="player-1-name" placeholder="Your name" maxlength="20">
                </div>
                <div class="player-input-group">
                    <label>Player 2</label>
                    <input type="text" id="player-2-name" placeholder="Friend's name (optional)" maxlength="20">
                </div>
                <div class="player-input-group">
                    <label>Player 3</label>
                    <input type="text" id="player-3-name" placeholder="Friend's name (optional)" maxlength="20">
                </div>
                <div class="player-input-group">
                    <label>Player 4</label>
                    <input type="text" id="player-4-name" placeholder="Friend's name (optional)" maxlength="20">
                </div>
            </div>

            <button id="start-game-btn" class="btn-start-game" onclick="startGame()">START ROUND</button>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="game-screen" style="display: none;">
        <div id="app-container">
            <!-- Header -->
            <header id="header">
                <div class="header-content">
                    <div class="hole-info">
                        <div class="hole-number">HOLE 1</div>
                        <div class="hole-meta">PAR 4 • 386 YDS</div>
                    </div>
                    <button id="menu-btn" class="menu-btn" title="Menu">☰</button>
                </div>
            </header>

            <!-- Map Container -->
            <div id="map"></div>

            <!-- Distance Display -->
            <div id="distance-display" class="distance-display">
                <div class="distance-column">
                    <div class="distance-label">FRONT</div>
                    <div class="distance-value">--</div>
                </div>
                <div class="distance-column center">
                    <div class="distance-label">CENTER</div>
                    <div class="distance-value main">--</div>
                </div>
                <div class="distance-column">
                    <div class="distance-label">BACK</div>
                    <div class="distance-value">--</div>
                </div>
            </div>

            <!-- GPS Status -->
            <div id="gps-status" class="gps-status">GPS ± -- yd</div>

            <!-- Players Scoring Section -->
            <div id="players-section" class="players-section">
                <div id="players-container" class="players-container">
                    <!-- Player cards will be inserted here -->
                </div>
            </div>

            <!-- Controls -->
            <div id="controls" class="controls">
                <button id="prev-hole" class="btn btn-secondary" disabled>← HOLE</button>
                <button id="next-hole" class="btn btn-secondary">HOLE →</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="data/courses.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
